defaults:
  - _self_
  - /callbacks: [  learning_rate_monitor ]
  - /data: lm1b
  - /model: small
  - /strategy: ddp
  - /noise: loglinear
  - /lr_scheduler: constant_warmup

mode: eval
time_conditioning: False

#time_dependent: False
#rate_scaling: False

time_dependent: True
rate_scaling: True


seed: 2

loader:
  global_batch_size: 64
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  steps: 128
  num_sample_batches: 8  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 64

eval:
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  compute_generative_perplexity: True
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: True
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16-mixed'
  num_sanity_val_steps: 2
  max_steps: 200_000 #1_000_000
  log_every_n_steps: 10
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 10 #1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 5000

wandb:
  project: text-diffusion
  #  notes: Mulan for text
  group: null
  job_type: null
#  offline: true
  name: pef_eval
  tags:
    - ${data.train}
    - ${data.valid}
    - time_dependent:${time_dependent}
    - rate_scaling:${rate_scaling}
#    - ${noise.type}

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
#  save_dir: "/home/sean/Documents/edit-flows/outputs/lm1b/2025.12.24/182020"
#  save_dir: '/home/sean/Documents/edit-flows/outputs/750k_pef'
  save_dir: "/home/sean/Documents/edit-flows/outputs/lm1b/2025.12.25/060841"
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
